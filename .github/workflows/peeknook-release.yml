name: PeekNook Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: astral-sh/setup-uv@v5
      - name: Backend deps
        run: uv sync
      - name: Build sidecar
        run: bash scripts/build-backend.sh
      - name: Build UI
        run: cd ui && npm ci && npm run build
      - name: Resolve GitHub repo
        id: repo
        run: echo "slug=$(bash scripts/peeknook-github-repo.sh)" >> "$GITHUB_OUTPUT"
      - name: Build Tauri (macOS)
        run: |
          TAG="${GITHUB_REF_NAME}"
          REPO="${{ steps.repo.outputs.slug }}"
          UPDATER="${RUNNER_TEMP}/updater.json"
          python3 -c "
          import json, os
          repo = os.environ['REPO']
          tag = os.environ['TAG']
          path = os.environ['UPDATER']
          ep = f'https://github.com/{repo}/releases/download/{tag}/latest.json'
          json.dump({'plugins': {'updater': {'endpoints': [ep]}}}, open(path, 'w'))
          "
          cd desktop
          npm ci
          npm run tauri build -- --config "$UPDATER"
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ steps.repo.outputs.slug }}
          UPDATER: ${{ runner.temp }}/updater.json
      - name: Smoke test macOS bundle
        run: |
          APP="desktop/src-tauri/target/release/bundle/macos/PeekNook.app"
          DMG=$(ls -1 desktop/src-tauri/target/release/bundle/dmg/*.dmg | head -1)
          TAR=$(ls -1 desktop/src-tauri/target/release/bundle/macos/*.tar.gz | head -1)
          test -d "$APP"
          test -f "$DMG"
          test -f "$TAR"
          echo "App: $APP ($(du -sh "$APP" | cut -f1))"
          echo "DMG: $DMG ($(du -sh "$DMG" | cut -f1))"
          echo "Updater: $TAR"
          test -x "$APP/Contents/MacOS/desktop"
      - name: Sign macOS (optional)
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/peeknook-sign-macos.sh
      - name: Notarize macOS DMG (optional)
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/peeknook-notarize-macos.sh
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: peeknook-macos
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/macos/PeekNook.app
            desktop/src-tauri/target/release/bundle/macos/*.tar.gz
            desktop/src-tauri/target/release/bundle/macos/*.sig

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: astral-sh/setup-uv@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve GitHub repo
        id: repo
        shell: bash
        run: echo "slug=$(bash scripts/peeknook-github-repo.sh)" >> "$GITHUB_OUTPUT"
      - name: Backend deps
        run: uv sync
      - name: Build sidecar
        run: bash scripts/build-backend.sh
        shell: bash
      - name: Build UI
        run: cd ui && npm ci && npm run build
      - name: Build Tauri (Windows)
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          REPO="${{ steps.repo.outputs.slug }}"
          UPDATER="${RUNNER_TEMP}/updater.json"
          python3 -c "
          import json, os
          repo = os.environ['REPO']
          tag = os.environ['TAG']
          path = os.environ['UPDATER']
          ep = f'https://github.com/{repo}/releases/download/{tag}/latest.json'
          json.dump({'plugins': {'updater': {'endpoints': [ep]}}}, open(path, 'w'))
          "
          cd desktop
          npm ci
          npm run tauri build -- --config "$UPDATER"
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ steps.repo.outputs.slug }}
          UPDATER: ${{ runner.temp }}/updater.json
      - name: Smoke test Windows bundle
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path desktop/src-tauri/target/release/bundle/nsis -Filter *.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          $msi = Get-ChildItem -Path desktop/src-tauri/target/release/bundle/msi -Filter *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe -and -not $msi) { throw "No Windows installer artifacts found" }
          if ($exe) { Write-Host "EXE: $($exe.FullName) size=$($exe.Length)" }
          if ($msi) { Write-Host "MSI: $($msi.FullName) size=$($msi.Length)" }
      - name: Sign Windows (optional)
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_SIGNING_TIMESTAMP_URL: ${{ secrets.WINDOWS_SIGNING_TIMESTAMP_URL }}
        shell: pwsh
        run: pwsh scripts/peeknook-sign-windows.ps1
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: peeknook-windows
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/*.sig

  publish-release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: peeknook-macos
          path: dist/release/macos
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: peeknook-windows
          path: dist/release/windows
      - name: Generate updater manifest
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          python3 scripts/peeknook-updater-manifest.py \
            --version "$VERSION" \
            --tag "$TAG" \
            --repo "${{ github.repository }}" \
            --out dist/release/latest.json \
            dist/release/macos dist/release/windows
      - name: List release files
        run: find dist/release -type f | sort
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/release/latest.json
            dist/release/macos/**/*.dmg
            dist/release/macos/**/*.tar.gz
            dist/release/macos/**/*.sig
            dist/release/windows/**/*.msi
            dist/release/windows/**/*.exe
            dist/release/windows/**/*.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
